
name: Generate Snake Animation

# Builds the contribution-snake SVG and pushes it to the "output" branch,
# where the README reads it from. No personal access token needed —
# the built-in GITHUB_TOKEN is enough for a public profile repo.

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches:
      - main                  # if your default branch is "master", change this

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG (palette-matched)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # exactly 5 dot colors, from "no contributions" -> "most".
          # tuned to the cyan -> violet -> magenta theme used in the README.
          outputs: |
            dist/github-snake.svg?color_snake=%2300e5ff&color_dots=%230b1437,%231e3a8a,%236d28d9,%23c026d3,%23ff2bd6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to the output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "chore: update snake animation [skip ci]"
